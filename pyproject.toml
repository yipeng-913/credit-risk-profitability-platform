[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"
[project]
name = "credit-risk-profitability-platform"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
"dags/credit_risk_pipeline.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
